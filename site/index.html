<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZF TrendPicking - 股票篩選查詢</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e4e4e7;
      --text-dim: #8b8d97;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
      --tag-vcp: #3b82f6;
      --tag-sanxian: #a855f7;
      --tag-strong: #22c55e;
      --tag-newhigh: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent), var(--tag-sanxian));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-dim);
      font-size: 14px;
    }

    .search-box {
      position: relative;
      margin-bottom: 24px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      font-size: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box input::placeholder { color: var(--text-dim); }

    .search-box .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 18px;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      flex: 1;
      min-width: 120px;
    }

    .stat-card .label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .stat-card .value { font-size: 22px; font-weight: 700; }

    .loading {
      text-align: center;
      padding: 60px 0;
      color: var(--text-dim);
    }

    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results { display: flex; flex-direction: column; gap: 16px; }

    .stock-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .stock-card:hover { border-color: var(--accent); }

    .stock-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
    }

    .stock-header:hover { background: rgba(99, 102, 241, 0.05); }

    .stock-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stock-id {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }

    .stock-name {
      font-size: 15px;
      color: var(--text);
    }

    .market-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .market-badge.tw { background: #1e3a5f; color: #60a5fa; }
    .market-badge.us { background: #3b1f1f; color: #fca5a5; }

    .appearance-count {
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .appearance-count strong {
      color: var(--text);
      font-size: 18px;
    }

    .stock-details { display: none; }
    .stock-card.open .stock-details { display: block; }

    .appearance-list { padding: 0 20px 16px; }

    .appearance-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.02);
    }

    .appearance-item:hover { background: rgba(255, 255, 255, 0.05); }

    .date-text {
      font-weight: 600;
      min-width: 100px;
      font-variant-numeric: tabular-nums;
    }

    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .tag.vcp { background: rgba(59, 130, 246, 0.15); color: var(--tag-vcp); }
    .tag.sanxian { background: rgba(168, 85, 247, 0.15); color: var(--tag-sanxian); }
    .tag.strong { background: rgba(34, 197, 94, 0.15); color: var(--tag-strong); }
    .tag.newhigh { background: rgba(245, 158, 11, 0.15); color: var(--tag-newhigh); }

    .detail-value {
      font-size: 13px;
      color: var(--text-dim);
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }

    .detail-value.positive { color: var(--green); }
    .detail-value.negative { color: var(--red); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }

    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    .industry-text {
      font-size: 12px;
      color: var(--text-dim);
    }

    footer {
      text-align: center;
      padding: 40px 0 20px;
      color: var(--text-dim);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .container { padding: 16px 12px; }
      header h1 { font-size: 22px; }
      .stock-header { padding: 12px 14px; }
      .appearance-list { padding: 0 14px 12px; }
      .stats { gap: 8px; }
      .stat-card { padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ZF TrendPicking</h1>
      <p>搜尋股票，查看出現在 VCP / 三線開花篩選的日期</p>
    </header>

    <div class="search-box">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="searchInput" placeholder="輸入股票代號或名稱（例：2330、台積電、AAPL）" autocomplete="off">
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="tw">台股</button>
      <button class="filter-btn" data-filter="us">美股</button>
      <button class="filter-btn" data-filter="vcp">VCP</button>
      <button class="filter-btn" data-filter="sanxian">三線開花</button>
    </div>

    <div class="stats" id="stats">
      <div class="stat-card">
        <div class="label">資料更新</div>
        <div class="value" id="statDate">-</div>
      </div>
      <div class="stat-card">
        <div class="label">總股票數</div>
        <div class="value" id="statStocks">-</div>
      </div>
      <div class="stat-card">
        <div class="label">總紀錄數</div>
        <div class="value" id="statRecords">-</div>
      </div>
    </div>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <p>載入資料中...</p>
      </div>
    </div>

    <footer>
      <p>ZF TrendPicking &copy; 2026 | 資料來源：FinMind + yfinance</p>
    </footer>
  </div>

  <script>
    let DATA = null;
    let activeFilters = { market: 'all', type: 'all' };

    async function loadData() {
      try {
        const resp = await fetch('data/filter_results.json');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        DATA = await resp.json();

        document.getElementById('statDate').textContent = DATA.generated_at;
        document.getElementById('statStocks').textContent = DATA.total_stocks.toLocaleString();
        document.getElementById('statRecords').textContent = DATA.total_records.toLocaleString();

        document.getElementById('content').innerHTML =
          '<div class="empty-state"><div class="icon">&#128270;</div><p>輸入股票代號或名稱開始搜尋</p></div>';
      } catch (err) {
        document.getElementById('content').innerHTML =
          `<div class="empty-state"><div class="icon">&#9888;</div><p>載入資料失敗: ${err.message}</p></div>`;
      }
    }

    function search(query) {
      if (!DATA || !query.trim()) {
        document.getElementById('content').innerHTML =
          '<div class="empty-state"><div class="icon">&#128270;</div><p>輸入股票代號或名稱開始搜尋</p></div>';
        return;
      }

      const q = query.trim().toLowerCase();
      const matches = [];

      for (const [sid, stock] of Object.entries(DATA.stocks)) {
        if (
          sid.toLowerCase().includes(q) ||
          stock.stock_name.toLowerCase().includes(q)
        ) {
          matches.push(stock);
        }
      }

      // Apply market/type filters & sort
      const filtered = matches.map(stock => {
        const filteredAppearances = stock.appearances.filter(a => {
          if (activeFilters.market !== 'all' && stock.market !== activeFilters.market) return false;
          if (activeFilters.type !== 'all' && a.type !== activeFilters.type) return false;
          return true;
        });
        return { ...stock, appearances: filteredAppearances };
      }).filter(s => s.appearances.length > 0);

      // Sort by total appearances desc
      filtered.sort((a, b) => b.appearances.length - a.appearances.length);

      if (filtered.length === 0) {
        document.getElementById('content').innerHTML =
          `<div class="empty-state"><div class="icon">&#128533;</div><p>找不到「${escapeHtml(query)}」的相關結果</p></div>`;
        return;
      }

      renderResults(filtered);
    }

    function renderResults(stocks) {
      const html = stocks.map(stock => {
        const sortedAppearances = [...stock.appearances].sort((a, b) => b.date.localeCompare(a.date));

        const appearanceHtml = sortedAppearances.map(a => {
          let tags = '';
          let detail = '';

          if (a.type === 'vcp') {
            tags = `<span class="tag vcp">VCP</span>`;
            if (a.is_strong) tags += `<span class="tag strong">強勢</span>`;
            if (a.is_new_high) tags += `<span class="tag newhigh">新高</span>`;
            if (a.return_20d != null) {
              const cls = a.return_20d >= 0 ? 'positive' : 'negative';
              const sign = a.return_20d >= 0 ? '+' : '';
              detail = `<span class="detail-value ${cls}">${sign}${a.return_20d.toFixed(2)}%</span>`;
            }
          } else {
            tags = `<span class="tag sanxian">三線開花</span>`;
            if (a.gap_ratio != null) {
              const cls = a.gap_ratio >= 0 ? 'positive' : 'negative';
              const sign = a.gap_ratio >= 0 ? '+' : '';
              detail = `<span class="detail-value ${cls}">差距 ${sign}${a.gap_ratio.toFixed(2)}%</span>`;
            }
          }

          return `<div class="appearance-item">
            <span class="date-text">${a.date}</span>
            ${tags}
            ${detail}
          </div>`;
        }).join('');

        return `<div class="stock-card" onclick="this.classList.toggle('open')">
          <div class="stock-header">
            <div class="stock-info">
              <span class="market-badge ${stock.market}">${stock.market === 'tw' ? '台股' : '美股'}</span>
              <span class="stock-id">${escapeHtml(stock.stock_id)}</span>
              <span class="stock-name">${escapeHtml(stock.stock_name)}</span>
              <span class="industry-text">${escapeHtml(stock.industry)}</span>
            </div>
            <div class="appearance-count">
              出現 <strong>${stock.appearances.length}</strong> 次
            </div>
          </div>
          <div class="stock-details">
            <div class="appearance-list">${appearanceHtml}</div>
          </div>
        </div>`;
      }).join('');

      document.getElementById('content').innerHTML = `<div class="results">${html}</div>`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
      search(e.target.value);
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;

        if (['all', 'tw', 'us'].includes(filter)) {
          document.querySelectorAll('.filter-btn[data-filter="all"], .filter-btn[data-filter="tw"], .filter-btn[data-filter="us"]')
            .forEach(b => b.classList.remove('active'));
          activeFilters.market = filter === 'all' ? 'all' : filter;
          if (filter === 'all') activeFilters.type = 'all';
        }

        if (['vcp', 'sanxian'].includes(filter)) {
          const wasActive = btn.classList.contains('active');
          document.querySelectorAll('.filter-btn[data-filter="vcp"], .filter-btn[data-filter="sanxian"]')
            .forEach(b => b.classList.remove('active'));
          activeFilters.type = wasActive ? 'all' : filter;
          if (!wasActive) {
            // Deactivate "all" market button if a type filter is selected
          }
        }

        if (filter === 'all') {
          activeFilters = { market: 'all', type: 'all' };
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        }

        btn.classList.toggle('active', !btn.classList.contains('active') || filter === 'all');

        // Ensure "all" is active when no specific filters
        if (activeFilters.market === 'all' && activeFilters.type === 'all') {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
        }

        const query = document.getElementById('searchInput').value;
        if (query.trim()) search(query);
      });
    });

    loadData();
  </script>
</body>
</html>
